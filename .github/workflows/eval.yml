name: Eval

# Runs the 20-question eval against the real LLM. Uses ~25 Groq calls per run,
# so it only runs when retrieval/prompt/corpus code changes, or on demand.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "eval/**"
      - "docs/**"
      - "data/faiss_index/**"
      - "requirements.txt"

jobs:
  eval:
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: data/fastembed_cache
          key: fastembed-${{ hashFiles('scripts/embeddings.py', 'requirements.txt') }}
      - name: Check the Groq key is configured
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::error::Add GROQ_API_KEY under Settings > Secrets and variables > Actions"
            exit 1
          fi
      - run: python eval/run_eval.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: eval/eval_results.json
